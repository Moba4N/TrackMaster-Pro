name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Wiederherstellen
        run: dotnet restore TrackMasterPro.sln

      - name: Bauen (Release)
        run: dotnet build TrackMasterPro.sln -c Release --no-restore

      - name: Tests
        run: dotnet test tests/TrackMaster.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Programme veröffentlichen
        run: |
          dotnet publish src/TrackMaster.App -c Release -r win-x64 --self-contained false -o artifacts/TrackMasterPro
          dotnet publish tools/TrackMaster.Lizenzverwaltung -c Release -r win-x64 --self-contained false -o artifacts/Lizenzwerkzeuge
          dotnet publish tools/TrackMaster.LicenseTool -c Release -r win-x64 --self-contained false -o artifacts/Lizenzwerkzeuge

      - name: Windows-Installer (MSI)
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          dotnet publish src/TrackMaster.App -c Release -r win-x64 --self-contained true -o artifacts/msi-input
          $manual = 0
          if (Test-Path docs/TrackMaster-Pro-Handbuch.pdf) {
            Copy-Item docs/TrackMaster-Pro-Handbuch.pdf artifacts/msi-input/Handbuch.pdf
            $manual = 1
          }
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          New-Item -ItemType Directory -Force artifacts/setup | Out-Null
          wix build installer/TrackMasterPro.wxs -arch x64 -culture de-DE -ext WixToolset.UI.wixext `
            -d Version=$v -d "PublishDir=$PWD\artifacts\msi-input" -d HasManual=$manual `
            -o "artifacts/setup/TrackMasterPro-$v.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build fehlgeschlagen" }
          Remove-Item artifacts/setup/*.wixpdb -ErrorAction SilentlyContinue
          Get-ChildItem artifacts/setup | Format-Table Name, Length

      - name: Installer prüfen (still installieren, starten, deinstallieren)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem artifacts/setup/*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$PWD\artifacts\setup-install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content artifacts/setup-install.log -Tail 60; throw "Installation fehlgeschlagen ($($p.ExitCode))" }
          $exe = "$env:ProgramFiles\TrackMaster Pro\TrackMasterPro.exe"
          if (-not (Test-Path $exe)) { throw "Programm nicht installiert" }
          $shot = "$PWD/artifacts/screenshot-installiert.png"
          $app = Start-Process -FilePath $exe -ArgumentList @("--screenshot", $shot) -PassThru
          if (-not $app.WaitForExit(120000)) { $app.Kill(); throw "Installiertes Programm reagiert nicht" }
          if (-not (Test-Path $shot)) { throw "Installiertes Programm startet nicht" }
          Get-ChildItem "$env:ProgramFiles\TrackMaster Pro" -Filter *.pdf
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Deinstallation fehlgeschlagen ($($p.ExitCode))" }
          if (Test-Path $exe) { throw "Programm nach Deinstallation noch vorhanden" }

      - name: Bildschirmfotos
        shell: pwsh
        run: |
          function Shot($exe, $name, [string[]]$more) {
            $file = "$PWD/artifacts/$name.png"
            $p = Start-Process -FilePath $exe -ArgumentList (@("--screenshot", $file) + $more) -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Zeitüberschreitung beim Bildschirmfoto $name" }
            if (Test-Path "$file.error.txt") { Get-Content "$file.error.txt"; throw "Fehler beim Bildschirmfoto $name" }
            if (-not (Test-Path $file)) { throw "Kein Bildschirmfoto $name (Exitcode $($p.ExitCode))" }
          }
          $app = "artifacts/TrackMasterPro/TrackMasterPro.exe"
          Shot $app "screenshot-basis" @()
          Shot $app "screenshot" @("--pro")
          Shot $app "screenshot-auswahl" @("--pro", "--tab", "Gleise", "--select")
          Shot $app "screenshot-gelaende" @("--pro", "--tab", "Gelände")
          Shot $app "screenshot-3d" @("--pro", "--3d", "orbit")
          Shot $app "screenshot-mitfahren" @("--pro", "--3d", "ride")
          Shot "artifacts/Lizenzwerkzeuge/TrackMaster.Lizenzverwaltung.exe" "screenshot-lizenzverwaltung" @()
          # Bilder für das Handbuch: neutrale Gleissystem-Namen, ohne Herstellerbezeichnungen
          New-Item -ItemType Directory -Force artifacts/handbuch | Out-Null
          function Hb($name, [string[]]$more) {
            try { Shot $app "handbuch/$name" (@("--neutral") + $more) } catch { Write-Warning "Handbuchbild ${name}: $_" }
          }
          Hb "start" @()
          Hb "start-pro" @("--pro")
          Hb "gleise" @("--tab", "Gleise", "--select")
          Hb "gelaende" @("--tab", "Gelände")
          Hb "elektrik" @("--tab", "Elektrik")
          Hb "ansicht" @("--tab", "Ansicht")
          Hb "3d" @("--3d", "orbit")
          Hb "mitfahren" @("--3d", "ride")
          Hb "abend" @("--3d", "evening")
          Hb "neu" @("--dialog", "new")
          Hb "wendel" @("--dialog", "helix")
          Hb "pruefung" @("--dialog", "check")
          Hb "kabelplan" @("--dialog", "wiring")
          Hb "lizenz" @("--dialog", "license")
          Hb "pro-hinweis" @("--dialog", "save")
          Hb "stueckliste" @("--pro", "--dialog", "bom")
          Hb "holzliste" @("--pro", "--dialog", "holzliste")

      - name: Vorschau für die Prüfung (verkleinert, Base64)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($file in Get-ChildItem "$PWD/artifacts/*.png") {
            $name = $file.BaseName
            $img = [System.Drawing.Image]::FromFile($file.FullName)
            $w = [int]($img.Width * 0.6); $h = [int]($img.Height * 0.6)
            $bmp = New-Object System.Drawing.Bitmap $img, $w, $h
            $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq "image/jpeg" }
            $params = New-Object System.Drawing.Imaging.EncoderParameters 1
            $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 75L
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms, $codec, $params)
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            Write-Output "PREVIEW-$name-BEGIN"
            for ($i = 0; $i -lt $b64.Length; $i += 2000) { Write-Output $b64.Substring($i, [Math]::Min(2000, $b64.Length - $i)) }
            Write-Output "PREVIEW-$name-END"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TrackMasterPro-win-x64
          path: artifacts/TrackMasterPro

      - uses: actions/upload-artifact@v4
        with:
          name: TrackMasterPro-Setup
          path: artifacts/setup/*.msi

      - uses: actions/upload-artifact@v4
        with:
          name: Lizenzwerkzeuge-win-x64
          path: artifacts/Lizenzwerkzeuge

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bildschirmfotos
          path: |
            artifacts/*.png
            artifacts/*.error.txt
            artifacts/handbuch
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android-Workload
        run: dotnet workload install android

      - name: Android-SDK-Bestandteile
        run: >
          dotnet build src/TrackMaster.Android -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory=$ANDROID_HOME -p:JavaSdkDirectory=$JAVA_HOME -p:AcceptAndroidSDKLicenses=True

      - name: Schlüssel zum Signieren
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
            echo "KEYPASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
          else
            echo "KEYSTORE=$PWD/src/TrackMaster.Android/trackmaster.keystore" >> $GITHUB_ENV
            echo "KEYPASS=trackmaster-android" >> $GITHUB_ENV
          fi

      - name: APK bauen (Release, signiert)
        run: >
          dotnet publish src/TrackMaster.Android -c Release -f net10.0-android
          -p:AndroidSdkDirectory=$ANDROID_HOME -p:JavaSdkDirectory=$JAVA_HOME
          -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$KEYSTORE -p:AndroidSigningKeyAlias=trackmaster
          -p:AndroidSigningKeyPass=$KEYPASS -p:AndroidSigningStorePass=$KEYPASS
          -o artifacts/android

      - name: APK bauen (Debug, für die Prüfung)
        run: >
          dotnet build src/TrackMaster.Android -c Debug -f net10.0-android
          -p:AndroidSdkDirectory=$ANDROID_HOME -p:JavaSdkDirectory=$JAVA_HOME
          -p:EmbedAssembliesIntoApk=true -p:RuntimeIdentifier=android-x64
          -o artifacts/android-debug

      - name: APK-Dateien
        run: |
          ls -la artifacts/android artifacts/android-debug
          mkdir -p artifacts/apk
          cp artifacts/android/*-Signed.apk artifacts/apk/TrackMasterPro.apk
          ls -la artifacts/apk

      - name: Platz für den Emulator schaffen
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/local/share/powershell /usr/share/miniconda || true
          rm -rf src/*/obj src/*/bin
          df -h $HOME

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Im Emulator prüfen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          disk-size: 3000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-smoke.sh artifacts/apk/TrackMasterPro.apk "$(ls artifacts/android-debug/*-Signed.apk | head -1)" artifacts/android-shots

      - name: Vorschau für die Prüfung (verkleinert, Base64)
        if: always()
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for f in sorted(glob.glob("artifacts/android-shots/*.png")):
              name = os.path.splitext(os.path.basename(f))[0]
              try:
                  img = Image.open(f).convert("RGB")
              except Exception as e:
                  print(f"PREVIEW-{name}-FEHLER {e}"); continue
              img = img.resize((int(img.width * 0.3), int(img.height * 0.3)))
              buf = io.BytesIO(); img.save(buf, "JPEG", quality=70)
              b64 = base64.b64encode(buf.getvalue()).decode()
              print(f"PREVIEW-{name}-BEGIN")
              for i in range(0, len(b64), 2000): print(b64[i:i + 2000])
              print(f"PREVIEW-{name}-END")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: TrackMasterPro-Android
          path: artifacts/apk/TrackMasterPro.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Bildschirmfotos
          path: artifacts/android-shots
          if-no-files-found: ignore

  release:
    # Installer, APK und Handbuch als Release zum Herunterladen; Bildschirmfotos für das Handbuch in einen eigenen Zweig
    needs: [windows, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: TrackMasterPro-Setup
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: TrackMasterPro-Android
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: Bildschirmfotos
          path: shots/windows
      - uses: actions/download-artifact@v4
        with:
          name: Android-Bildschirmfotos
          path: shots/android

      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          tag="v$v"
          if [ -f docs/TrackMaster-Pro-Handbuch.pdf ]; then cp docs/TrackMaster-Pro-Handbuch.pdf out/; fi
          mv out/TrackMasterPro.apk "out/TrackMasterPro-$v.apk"
          ls -la out
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "TrackMaster Pro $v" \
              --notes "Windows-Installer (MSI), Android-App (APK) und Handbuch. Ohne Lizenz läuft die Basisversion, mit Lizenzdatei Pro."
          fi
          gh release upload "$tag" out/* --clobber

      - name: Bildschirmfotos für das Handbuch
        run: |
          cd shots
          git init -q -b handbuch-bilder
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Bildschirmfotos $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" handbuch-bilder
