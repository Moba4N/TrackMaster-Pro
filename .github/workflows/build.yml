name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Wiederherstellen
        run: dotnet restore TrackMasterPro.sln

      - name: Bauen (Release)
        run: dotnet build TrackMasterPro.sln -c Release --no-restore

      - name: Tests
        run: dotnet test tests/TrackMaster.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Programm veröffentlichen
        run: dotnet publish src/TrackMaster.App -c Release -r win-x64 --self-contained false -o artifacts/TrackMasterPro

      - name: Bildschirmfoto (Beispielanlage)
        shell: pwsh
        run: |
          $exe = "artifacts/TrackMasterPro/TrackMasterPro.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--screenshot", "$PWD/artifacts/screenshot.png" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Zeitüberschreitung beim Bildschirmfoto" }
          if (Test-Path "artifacts/screenshot.png.error.txt") { Get-Content "artifacts/screenshot.png.error.txt"; throw "Fehler beim Start" }
          if (-not (Test-Path "artifacts/screenshot.png")) { throw "Kein Bildschirmfoto erzeugt (Exitcode $($p.ExitCode))" }

      - name: Bildschirmfoto (Weiche gewählt, Register Gleise)
        shell: pwsh
        run: |
          $exe = "artifacts/TrackMasterPro/TrackMasterPro.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--screenshot", "$PWD/artifacts/screenshot-auswahl.png", "--tab", "Gleise", "--select" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Zeitüberschreitung beim Bildschirmfoto" }
          if (Test-Path "artifacts/screenshot-auswahl.png.error.txt") { Get-Content "artifacts/screenshot-auswahl.png.error.txt"; throw "Fehler beim Start" }
          if (-not (Test-Path "artifacts/screenshot-auswahl.png")) { throw "Kein Bildschirmfoto erzeugt (Exitcode $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: TrackMasterPro-win-x64
          path: artifacts/TrackMasterPro

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bildschirmfotos
          path: |
            artifacts/*.png
            artifacts/*.error.txt
          if-no-files-found: ignore
